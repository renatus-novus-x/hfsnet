name: GUI host (macOS)

on:
  push:
    paths:
      - "gui/**"
      - "test/**"
      - ".github/workflows/gui-macos.yml"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GUI (macOS)
        run: |
          cmake -S gui -B gui/build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build-ci -j3
      - name: Upload GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: hfsnet-host-macos
          path: gui/build-ci/hfsnet-host
      - name: Build GUI (macOS, Intel)
        run: |
          cmake -S gui -B gui/build-ci-intel -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build gui/build-ci-intel -j3
      - name: Upload GUI binary (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: hfsnet-host-macos-intel
          path: gui/build-ci-intel/hfsnet-host
      - name: Build headless engine
        run: |
          cmake -S gui -B gui/build-ci-headless -DCMAKE_BUILD_TYPE=Release -DHFSNET_BUILD_GUI=OFF
          cmake --build gui/build-ci-headless -j3
      - name: Run tests against the C++ engine
        run: gui/ci/run_tests.sh gui/build-ci-headless/hfsnet-host
