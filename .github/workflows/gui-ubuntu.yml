name: GUI host (Ubuntu)

on:
  push:
    paths:
      - "gui/**"
      - "test/**"
      - ".github/workflows/gui-ubuntu.yml"
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglu1-mesa-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Build GUI (Ubuntu)
        run: |
          cmake -S gui -B gui/build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build-ci -j3
      - name: Build headless engine
        run: |
          cmake -S gui -B gui/build-ci-headless -DCMAKE_BUILD_TYPE=Release -DHFSNET_BUILD_GUI=OFF
          cmake --build gui/build-ci-headless -j3
      - name: Run tests against the C++ engine
        run: gui/ci/run_tests.sh gui/build-ci-headless/hfsnet-host
      - name: Run tests against the Python host
        run: |
          python3 test/sim_test.py
          python3 test/udp_test.py
          python3 gui/ci/raw_refuse_check.py
